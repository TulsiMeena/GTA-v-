<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>City 3D Open World</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a2236 0%, #080c14 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      transition: opacity 0.5s ease;
    }
    .loading-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff9900, #ff5500, #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .loading-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 280px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9900, #ff5500);
      transition: width 0.2s ease;
      border-radius: 4px;
    }
    .progress-text {
      margin-top: 10px;
      font-size: 12px;
      color: #cbd5e1;
      font-family: monospace;
    }
  </style>
  <script src="https://appassets.androidplatform.net/assets/js/three.min.js"></script>
  <script src="https://appassets.androidplatform.net/assets/js/GLTFLoader.js"></script>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-title">Open World City 3D</div>
    <div class="loading-subtitle">Setting up City, Light Poles, Trees & Signals...</div>
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div id="progress-text" class="progress-text">Initializing world engine...</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // Game & Three.js State
    let scene, camera, renderer;
    let cityModel = null;
    let characterMesh = null;
    let characterLimbs = { leftLeg: null, rightLeg: null, leftArm: null, rightArm: null, body: null };
    let clock = new THREE.Clock();
    let isLoaded = false;

    // Traffic signal materials list to animate
    let trafficLightSignals = [];

    // Camera modes: 'thirdperson' (default), 'firstperson', 'drone', 'orbit', 'topdown'
    let cameraMode = 'thirdperson';

    // Exact street elevation of the user's city model
    const ROAD_Y = -1.12;

    // Open boulevard coordinate where road is 100% clear of any building
    const START_X = -165.0;
    const START_Z = -160.0;

    // Player State
    const player = {
      position: new THREE.Vector3(START_X, ROAD_Y, START_Z),
      velocity: new THREE.Vector3(0, 0, 0),
      rotation: { yaw: 0, pitch: -0.08 },
      walkSpeed: 14.0,
      runSpeed: 28.0,
      isSprinting: false,
      isGrounded: true,
      verticalVelocity: 0,
      joystick: { x: 0, y: 0 },
      flyVertical: 0,
      walkAnimTime: 0
    };

    // Day/Night theme presets
    const timePresets = {
      day: {
        skyColor: 0x87ceeb,
        groundColor: 0x556b2f,
        fogColor: 0xc8ddf0,
        sunColor: 0xffffff,
        sunIntensity: 1.4,
        hemiIntensity: 0.85,
        streetLightIntensity: 0.0,
        sunPos: [200, 400, 200]
      },
      sunset: {
        skyColor: 0xfd5e53,
        groundColor: 0x301934,
        fogColor: 0xd97559,
        sunColor: 0xff7b25,
        sunIntensity: 1.1,
        hemiIntensity: 0.55,
        streetLightIntensity: 0.8,
        sunPos: [400, 70, 200]
      },
      night: {
        skyColor: 0x050813,
        groundColor: 0x020306,
        fogColor: 0x070c1a,
        sunColor: 0x335588,
        sunIntensity: 0.25,
        hemiIntensity: 0.2,
        streetLightIntensity: 1.5,
        sunPos: [-200, 300, -200]
      },
      cyberpunk: {
        skyColor: 0x120024,
        groundColor: 0x080010,
        fogColor: 0x220538,
        sunColor: 0x00ffff,
        sunIntensity: 0.85,
        hemiIntensity: 0.55,
        streetLightIntensity: 1.8,
        sunPos: [150, 300, 150]
      }
    };

    let hemiLight, dirLight;
    let streetLightsGroup = new THREE.Group();
    let cityRaycaster = new THREE.Raycaster();
    let cityMeshes = [];

    // Predefined spawn locations on the real open streets
    const spawnPoints = {
      center: { x: -165.0, y: ROAD_Y, z: -160.0, yaw: 0, name: 'Downtown Boulevard' },
      poles: { x: -165.0, y: ROAD_Y, z: -165.0, yaw: 0, name: 'Light Poles' },
      trees: { x: -165.0, y: ROAD_Y, z: -90.0, yaw: 0, name: 'Tree Boulevard' },
      traffic: { x: -165.0, y: ROAD_Y, z: -160.0, yaw: 0, name: 'Traffic Signals' },
      bridge: { x: -35.0, y: -1.0, z: 320.0, yaw: 1.57, name: 'Canal Bridge' },
      highway: { x: 400.0, y: 35.0, z: -200.0, yaw: 1.57, name: 'Elevated Highway' },
      rooftop: { x: -280.0, y: 114.0, z: 80.0, yaw: -0.8, name: 'Skyscraper Rooftop' }
    };

    function init() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(timePresets.day.skyColor);
      scene.fog = new THREE.FogExp2(timePresets.day.fogColor, 0.0006);

      // Camera
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.3, 4500);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      container.appendChild(renderer.domElement);

      // Lights
      hemiLight = new THREE.HemisphereLight(
        timePresets.day.skyColor,
        timePresets.day.groundColor,
        timePresets.day.hemiIntensity
      );
      scene.add(hemiLight);

      dirLight = new THREE.DirectionalLight(timePresets.day.sunColor, timePresets.day.sunIntensity);
      dirLight.position.set(200, 400, 200);
      scene.add(dirLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      scene.add(streetLightsGroup);

      // Create 3D Player Character standing directly on the street
      createCharacter();

      // Initial Camera Pose
      updateCameraPose();

      // Resize listener
      window.addEventListener('resize', onWindowResize, false);

      // Load Assets (User's City + Trees + Light Poles + Traffic Lights + Bridge)
      loadAllAssets();

      // Start animation loop
      requestAnimationFrame(animate);
    }

    // Build stylish 3D character mesh with animated limbs
    function createCharacter() {
      const charGroup = new THREE.Group();

      const skinMat = new THREE.MeshLambertMaterial({ color: 0xe0ac69 });
      const shirtMat = new THREE.MeshLambertMaterial({ color: 0x2563eb }); // Blue jacket
      const pantsMat = new THREE.MeshLambertMaterial({ color: 0x1e293b }); // Dark pants
      const shoeMat = new THREE.MeshLambertMaterial({ color: 0xffffff }); // White sneakers
      const hairMat = new THREE.MeshLambertMaterial({ color: 0x1c1917 }); // Dark hair
      const glassesMat = new THREE.MeshLambertMaterial({ color: 0x09090b }); // Sunglasses

      // Body / Torso
      const torsoGeo = new THREE.BoxGeometry(0.5, 0.75, 0.3);
      const torso = new THREE.Mesh(torsoGeo, shirtMat);
      torso.position.y = 1.35;
      charGroup.add(torso);
      characterLimbs.body = torso;

      // Head
      const headGeo = new THREE.BoxGeometry(0.32, 0.32, 0.32);
      const head = new THREE.Mesh(headGeo, skinMat);
      head.position.y = 1.95;
      charGroup.add(head);

      // Hair
      const hairGeo = new THREE.BoxGeometry(0.34, 0.12, 0.34);
      const hair = new THREE.Mesh(hairGeo, hairMat);
      hair.position.y = 2.12;
      charGroup.add(hair);

      // Sunglasses
      const glassGeo = new THREE.BoxGeometry(0.33, 0.08, 0.15);
      const glasses = new THREE.Mesh(glassGeo, glassesMat);
      glasses.position.set(0, 1.98, 0.16);
      charGroup.add(glasses);

      // Left Leg Pivot
      const leftLegPivot = new THREE.Group();
      leftLegPivot.position.set(-0.16, 0.98, 0);
      const legGeo = new THREE.BoxGeometry(0.2, 0.75, 0.22);
      const leftLegMesh = new THREE.Mesh(legGeo, pantsMat);
      leftLegMesh.position.y = -0.38;
      leftLegPivot.add(leftLegMesh);
      const shoeGeo = new THREE.BoxGeometry(0.22, 0.16, 0.32);
      const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
      leftShoe.position.set(0, -0.85, 0.05);
      leftLegPivot.add(leftShoe);
      charGroup.add(leftLegPivot);
      characterLimbs.leftLeg = leftLegPivot;

      // Right Leg Pivot
      const rightLegPivot = new THREE.Group();
      rightLegPivot.position.set(0.16, 0.98, 0);
      const rightLegMesh = new THREE.Mesh(legGeo, pantsMat);
      rightLegMesh.position.y = -0.38;
      rightLegPivot.add(rightLegMesh);
      const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
      rightShoe.position.set(0, -0.85, 0.05);
      rightLegPivot.add(rightShoe);
      charGroup.add(rightLegPivot);
      characterLimbs.rightLeg = rightLegPivot;

      // Left Arm Pivot
      const leftArmPivot = new THREE.Group();
      leftArmPivot.position.set(-0.35, 1.65, 0);
      const armGeo = new THREE.BoxGeometry(0.16, 0.65, 0.18);
      const leftArmMesh = new THREE.Mesh(armGeo, shirtMat);
      leftArmMesh.position.y = -0.32;
      leftArmPivot.add(leftArmMesh);
      const handGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
      const leftHand = new THREE.Mesh(handGeo, skinMat);
      leftHand.position.y = -0.68;
      leftArmPivot.add(leftHand);
      charGroup.add(leftArmPivot);
      characterLimbs.leftArm = leftArmPivot;

      // Right Arm Pivot
      const rightArmPivot = new THREE.Group();
      rightArmPivot.position.set(0.35, 1.65, 0);
      const rightArmMesh = new THREE.Mesh(armGeo, shirtMat);
      rightArmMesh.position.y = -0.32;
      rightArmPivot.add(rightArmMesh);
      const rightHand = new THREE.Mesh(handGeo, skinMat);
      rightHand.position.y = -0.68;
      rightArmPivot.add(rightHand);
      charGroup.add(rightArmPivot);
      characterLimbs.rightArm = rightArmPivot;

      characterMesh = charGroup;
      characterMesh.position.copy(player.position);
      scene.add(characterMesh);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let loadedCount = 0;
    const totalAssets = 5; // City, Tree, Light Pole, Traffic Light, Bridge

    function updateProgress(assetName, percent) {
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const totalPercent = Math.min(100, Math.round(((loadedCount * 100) + percent) / totalAssets));
      progressBar.style.width = totalPercent + '%';
      progressText.innerText = `Loading ${assetName} (${totalPercent}%)...`;
    }

    // Normalize 3D model pivot so bottom is strictly at Y=0 and centered in X/Z
    function createGroundedWrapper(gltfScene, targetHeight) {
      const box = new THREE.Box3().setFromObject(gltfScene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const scale = targetHeight / (size.y || 1);
      gltfScene.scale.set(scale, scale, scale);

      const scaledBox = new THREE.Box3().setFromObject(gltfScene);
      const scaledCenter = scaledBox.getCenter(new THREE.Vector3());

      gltfScene.position.x -= scaledCenter.x;
      gltfScene.position.z -= scaledCenter.z;
      gltfScene.position.y -= scaledBox.min.y;

      const wrapper = new THREE.Group();
      wrapper.add(gltfScene);
      return { wrapper, scale };
    }

    let treeTemplateWrapper = null;
    let lightPoleTemplateWrapper = null;
    let trafficTemplateWrapper = null;

    function loadAllAssets() {
      const loader = new THREE.GLTFLoader();

      // 1. Load Main City Model with fallback to direct cloud url if local asset fails
      function loadCityWithFallback(url, isFallback) {
        loader.load(
          url,
          function(gltf) {
            cityModel = gltf.scene;
            cityModel.updateMatrixWorld(true);

            cityModel.traverse(function(child) {
              if (child.isMesh) {
                cityMeshes.push(child);
                if (child.material) {
                  if (Array.isArray(child.material)) {
                    child.material.forEach(m => {
                      m.roughness = Math.max(m.roughness || 0.6, 0.4);
                      m.metalness = Math.min(m.metalness || 0.1, 0.4);
                    });
                  } else {
                    child.material.roughness = Math.max(child.material.roughness || 0.6, 0.4);
                    child.material.metalness = Math.min(child.material.metalness || 0.1, 0.4);
                  }
                }
              }
            });
            scene.add(cityModel);

            loadedCount++;
            checkAllLoaded();
          },
          function(xhr) {
            if (xhr.lengthComputable && xhr.total > 0) {
              const p = Math.round((xhr.loaded / xhr.total) * 100);
              updateProgress(isFallback ? 'City Map (Cloud)' : 'City Map', p);
            } else if (xhr.loaded > 0) {
              const mb = (xhr.loaded / (1024 * 1024)).toFixed(1);
              const progressText = document.getElementById('progress-text');
              if (progressText) progressText.innerText = `Loading City (${mb} MB)...`;
            }
          },
          function(err) {
            console.error('City local load error:', err);
            if (!isFallback) {
              const progressText = document.getElementById('progress-text');
              if (progressText) progressText.innerText = 'Streaming City from Cloud Backup...';
              // Fallback to direct cloud download URL
              loadCityWithFallback('https://drive.google.com/uc?export=download&id=1762kgD_-stHYIWni2Moq6tRFQ1zqviqt', true);
            } else {
              const progressText = document.getElementById('progress-text');
              if (progressText) progressText.innerText = 'City model load failed. Check connection.';
              loadedCount++;
              checkAllLoaded();
            }
          }
        );
      }

      loadCityWithFallback('https://appassets.androidplatform.net/assets/city.glb', false);

      // 2. Load Tree Model
      loader.load(
        'https://appassets.androidplatform.net/assets/tree.glb',
        function(gltf) {
          const { wrapper } = createGroundedWrapper(gltf.scene, 9.5);
          treeTemplateWrapper = wrapper;
          loadedCount++;
          checkAllLoaded();
        },
        null,
        function(err) {
          console.error('Tree load error', err);
          loadedCount++;
          checkAllLoaded();
        }
      );

      // 3. Load Light Pole Model (Street lamp provided by user)
      loader.load(
        'https://appassets.androidplatform.net/assets/light_pole.glb',
        function(gltf) {
          const { wrapper } = createGroundedWrapper(gltf.scene, 8.0);
          lightPoleTemplateWrapper = wrapper;
          loadedCount++;
          checkAllLoaded();
        },
        null,
        function(err) {
          console.error('Light pole load error', err);
          loadedCount++;
          checkAllLoaded();
        }
      );

      // 4. Load Traffic Light Model
      loader.load(
        'https://appassets.androidplatform.net/assets/traffic_light.glb',
        function(gltf) {
          const { wrapper } = createGroundedWrapper(gltf.scene, 6.0);
          trafficTemplateWrapper = wrapper;
          loadedCount++;
          checkAllLoaded();
        },
        null,
        function(err) {
          console.error('Traffic light load error', err);
          loadedCount++;
          checkAllLoaded();
        }
      );

      // 5. Load Bridge Model across Canal
      loader.load(
        'https://appassets.androidplatform.net/assets/bridge.glb',
        function(gltf) {
          const bridge = gltf.scene;
          bridge.scale.set(3.8, 3.8, 3.8);
          bridge.position.set(-35, -1.0, 320);
          bridge.rotation.y = Math.PI / 2;
          scene.add(bridge);

          loadedCount++;
          checkAllLoaded();
        },
        null,
        function(err) {
          console.error('Bridge load error', err);
          loadedCount++;
          checkAllLoaded();
        }
      );
    }

    // Place trees strictly along clear sidewalk edges — ZERO clipping into buildings!
    function populateRoadsideTrees() {
      if (!treeTemplateWrapper) return;
      const treesGroup = new THREE.Group();

      // Open boulevard segment: Z = -210 to -90
      // Left sidewalk curb: X = -174 | Right sidewalk curb: X = -156
      const treeZCoords = [-210, -180, -150, -120, -90];

      treeZCoords.forEach(z => {
        // Left side tree
        const treeLeft = treeTemplateWrapper.clone(true);
        treeLeft.position.set(-174, ROAD_Y, z);
        treeLeft.rotation.y = Math.random() * Math.PI * 2;
        treesGroup.add(treeLeft);

        // Right side tree
        const treeRight = treeTemplateWrapper.clone(true);
        treeRight.position.set(-156, ROAD_Y, z);
        treeRight.rotation.y = Math.random() * Math.PI * 2;
        treesGroup.add(treeRight);
      });

      // Canal Promenade Trees (100% open water promenade, no buildings)
      for (let z = 180; z <= 405; z += 30) {
        const tree = treeTemplateWrapper.clone(true);
        tree.position.set(-52, ROAD_Y, z);
        tree.rotation.y = Math.random() * Math.PI * 2;
        treesGroup.add(tree);
      }

      scene.add(treesGroup);
    }

    // Place light poles on BOTH sides of the road strictly on the sidewalk pavement
    function populateRoadsideLightPoles() {
      if (!lightPoleTemplateWrapper) return;
      const polesGroup = new THREE.Group();

      // Open boulevard segment: Z = -195 to -105
      // Left sidewalk curb: X = -174 | Right sidewalk curb: X = -156
      const poleZCoords = [-195, -165, -135, -105];

      poleZCoords.forEach((z, idx) => {
        // Left side pole (facing inward towards road)
        const poleLeft = lightPoleTemplateWrapper.clone(true);
        poleLeft.position.set(-174, ROAD_Y, z);
        poleLeft.rotation.y = 0; // facing road
        polesGroup.add(poleLeft);

        // Right side pole (facing inward towards road)
        const poleRight = lightPoleTemplateWrapper.clone(true);
        poleRight.position.set(-156, ROAD_Y, z);
        poleRight.rotation.y = Math.PI; // facing road
        polesGroup.add(poleRight);

        // Add street illumination light above each pole
        const streetLightLeft = new THREE.PointLight(0xfffaed, 0.0, 28, 1.8);
        streetLightLeft.position.set(-174, ROAD_Y + 7.5, z);
        streetLightsGroup.add(streetLightLeft);

        const streetLightRight = new THREE.PointLight(0xfffaed, 0.0, 28, 1.8);
        streetLightRight.position.set(-156, ROAD_Y + 7.5, z);
        streetLightsGroup.add(streetLightRight);
      });

      scene.add(polesGroup);
    }

    // Place traffic lights on roadside corners strictly on the model's road level
    function populateTrafficLights() {
      if (!trafficTemplateWrapper) return;
      const trafficGroup = new THREE.Group();

      const intersections = [
        // Main Boulevard Crossroad
        { x: -174, z: -160, rot: 0 },
        { x: -156, z: -160, rot: Math.PI }
      ];

      intersections.forEach(cfg => {
        const traffic = trafficTemplateWrapper.clone(true);
        traffic.position.set(cfg.x, ROAD_Y, cfg.z);
        traffic.rotation.y = cfg.rot;

        const signalSet = { red: [], yellow: [], green: [] };

        traffic.traverse(child => {
          if (child.isMesh && child.material) {
            child.material = child.material.clone();
            const matName = child.material.name || '';
            if (matName.includes('004') || (child.material.color && child.material.color.r > 0.8 && child.material.color.g < 0.2)) {
              signalSet.red.push(child.material);
            } else if (matName.includes('005') || (child.material.color && child.material.color.r > 0.7 && child.material.color.g > 0.7)) {
              signalSet.yellow.push(child.material);
            } else if (matName.includes('006') || (child.material.color && child.material.color.g > 0.8 && child.material.color.r < 0.2)) {
              signalSet.green.push(child.material);
            }
          }
        });

        trafficLightSignals.push(signalSet);
        trafficGroup.add(traffic);
      });

      scene.add(trafficGroup);
    }

    function checkAllLoaded() {
      if (loadedCount >= totalAssets) {
        populateRoadsideTrees();
        populateRoadsideLightPoles();
        populateTrafficLights();

        player.position.set(START_X, ROAD_Y, START_Z);
        if (characterMesh) {
          characterMesh.position.copy(player.position);
        }

        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        progressBar.style.width = '100%';
        progressText.innerText = 'City, Character, Poles & Props Ready!';

        setTimeout(() => {
          const screen = document.getElementById('loading-screen');
          screen.style.opacity = '0';
          setTimeout(() => { screen.style.display = 'none'; }, 500);
          isLoaded = true;
          notifyAndroidLoaded(cityMeshes.length, 3000, 3000);
        }, 300);
      }
    }

    // Raycast ground detection on the user's city meshes
    function getGroundHeight(x, z, currentY) {
      if (cityMeshes.length === 0) return ROAD_Y;

      cityRaycaster.set(new THREE.Vector3(x, 40, z), new THREE.Vector3(0, -1, 0));
      cityRaycaster.far = 80;

      const intersects = cityRaycaster.intersectObjects(cityMeshes, false);
      for (let i = 0; i < intersects.length; i++) {
        const pt = intersects[i].point;
        if (pt.y >= ROAD_Y - 0.5 && pt.y <= Math.max(currentY + 2.5, 4.0)) {
          return pt.y;
        }
      }
      return ROAD_Y;
    }

    let orbitAngle = 0;
    let lastStatsTime = 0;
    let trafficTimer = 0;
    let trafficState = 0; // 0: Green, 1: Yellow, 2: Red

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.08);

      if (isLoaded) {
        updateMovement(delta);
        updateTrafficSignals(delta);
      } else {
        if (characterMesh) {
          characterMesh.position.copy(player.position);
        }
        updateCameraPose();
      }

      renderer.render(scene, camera);

      if (currentTime - lastStatsTime > 150) {
        lastStatsTime = currentTime;
        sendTelemetry();
      }
    }

    function updateTrafficSignals(delta) {
      trafficTimer += delta;
      if (trafficTimer > 5.0) {
        trafficTimer = 0;
        trafficState = (trafficState + 1) % 3;
      }

      trafficLightSignals.forEach(signal => {
        signal.red.forEach(mat => {
          mat.emissive = new THREE.Color(trafficState === 2 ? 0xff1100 : 0x220000);
          mat.emissiveIntensity = trafficState === 2 ? 2.5 : 0.2;
        });
        signal.yellow.forEach(mat => {
          mat.emissive = new THREE.Color(trafficState === 1 ? 0xffaa00 : 0x221100);
          mat.emissiveIntensity = trafficState === 1 ? 2.5 : 0.2;
        });
        signal.green.forEach(mat => {
          mat.emissive = new THREE.Color(trafficState === 0 ? 0x00ff44 : 0x002208);
          mat.emissiveIntensity = trafficState === 0 ? 2.5 : 0.2;
        });
      });
    }

    function updateMovement(delta) {
      if (cameraMode === 'orbit') {
        if (characterMesh) characterMesh.visible = true;
        orbitAngle += delta * 0.1;
        const radius = 900;
        camera.position.x = START_X + Math.sin(orbitAngle) * radius;
        camera.position.z = START_Z + Math.cos(orbitAngle) * radius;
        camera.position.y = 350;
        camera.lookAt(START_X, 40, START_Z);
        return;
      }

      if (cameraMode === 'topdown') {
        if (characterMesh) characterMesh.visible = true;
        camera.position.set(START_X, 1100, START_Z);
        camera.rotation.set(-Math.PI / 2, 0, 0);
        return;
      }

      // Movement vector from joystick
      const speed = player.isSprinting ? player.runSpeed : player.walkSpeed;
      const moveX = player.joystick.x;
      const moveZ = player.joystick.y;

      const isMoving = (Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05);

      const forward = new THREE.Vector3(-Math.sin(player.rotation.yaw), 0, -Math.cos(player.rotation.yaw));
      const right = new THREE.Vector3(Math.cos(player.rotation.yaw), 0, -Math.sin(player.rotation.yaw));

      const dir = new THREE.Vector3()
        .addScaledVector(forward, -moveZ)
        .addScaledVector(right, moveX);

      if (isMoving && dir.lengthSq() > 0) {
        dir.normalize();
        player.position.addScaledVector(dir, speed * delta);

        const moveAngle = Math.atan2(dir.x, dir.z);
        if (characterMesh) {
          characterMesh.rotation.y = moveAngle;
        }

        const animSpeed = player.isSprinting ? 16.0 : 9.0;
        player.walkAnimTime += delta * animSpeed;
        const legSwing = Math.sin(player.walkAnimTime) * 0.65;
        const armSwing = Math.sin(player.walkAnimTime) * 0.55;

        if (characterLimbs.leftLeg) characterLimbs.leftLeg.rotation.x = legSwing;
        if (characterLimbs.rightLeg) characterLimbs.rightLeg.rotation.x = -legSwing;
        if (characterLimbs.leftArm) characterLimbs.leftArm.rotation.x = -armSwing;
        if (characterLimbs.rightArm) characterLimbs.rightArm.rotation.x = armSwing;
      } else {
        if (characterLimbs.leftLeg) characterLimbs.leftLeg.rotation.x *= 0.85;
        if (characterLimbs.rightLeg) characterLimbs.rightLeg.rotation.x *= 0.85;
        if (characterLimbs.leftArm) characterLimbs.leftArm.rotation.x *= 0.85;
        if (characterLimbs.rightArm) characterLimbs.rightArm.rotation.x *= 0.85;
      }

      if (cameraMode === 'drone') {
        player.position.y += player.flyVertical * speed * 0.8 * delta;
        player.position.y = Math.max(ROAD_Y, Math.min(600, player.position.y));
        if (characterMesh) characterMesh.visible = true;
      } else {
        // Street mode
        if (!player.isGrounded) {
          player.verticalVelocity -= 36.0 * delta;
          player.position.y += player.verticalVelocity * delta;
        }

        const groundY = getGroundHeight(player.position.x, player.position.z, player.position.y);

        if (player.position.y <= groundY + 0.15) {
          player.position.y = groundY;
          player.verticalVelocity = 0;
          player.isGrounded = true;
        } else {
          player.isGrounded = false;
        }

        if (player.position.y < ROAD_Y) {
          player.position.y = ROAD_Y;
          player.verticalVelocity = 0;
          player.isGrounded = true;
        }
      }

      if (characterMesh) {
        characterMesh.position.copy(player.position);
      }

      updateCameraPose();
    }

    function updateCameraPose() {
      if (cameraMode === 'thirdperson') {
        if (characterMesh) characterMesh.visible = true;

        const camDistance = 4.2;
        const camHeight = 2.2;

        const behindX = player.position.x + Math.sin(player.rotation.yaw) * camDistance * Math.cos(player.rotation.pitch);
        const behindZ = player.position.z + Math.cos(player.rotation.yaw) * camDistance * Math.cos(player.rotation.pitch);
        const behindY = Math.max(player.position.y + 0.5, player.position.y + camHeight - Math.sin(player.rotation.pitch) * camDistance);

        camera.position.set(behindX, behindY, behindZ);
        camera.lookAt(player.position.x, player.position.y + 1.4, player.position.z);
      } else if (cameraMode === 'firstperson') {
        if (characterMesh) characterMesh.visible = false;
        camera.position.set(player.position.x, player.position.y + 1.95, player.position.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = player.rotation.yaw;
        camera.rotation.x = player.rotation.pitch;
      } else if (cameraMode === 'drone') {
        camera.position.set(player.position.x, player.position.y + 3.0, player.position.z);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = player.rotation.yaw;
        camera.rotation.x = player.rotation.pitch;
      }
    }

    function sendTelemetry() {
      if (window.AndroidBridge && window.AndroidBridge.onTelemetry) {
        const speedKmh = (player.joystick.x !== 0 || player.joystick.y !== 0)
          ? Math.round((player.isSprinting ? player.runSpeed : player.walkSpeed) * 3.6)
          : 0;
        const headingDeg = Math.round(((-player.rotation.yaw * 180 / Math.PI) % 360 + 360) % 360);

        window.AndroidBridge.onTelemetry(
          player.position.x.toFixed(1),
          player.position.y.toFixed(1),
          player.position.z.toFixed(1),
          speedKmh,
          headingDeg,
          cameraMode
        );
      }
    }

    function notifyAndroidLoaded(meshCount, width, depth) {
      if (window.AndroidBridge && window.AndroidBridge.onCityLoaded) {
        window.AndroidBridge.onCityLoaded(meshCount, Math.round(width), Math.round(depth));
      }
    }

    // Public API exposed to Android / Compose
    window.gameAPI = {
      setJoystick: function(x, y) {
        player.joystick.x = x;
        player.joystick.y = y;
      },

      addLookRotation: function(deltaYaw, deltaPitch) {
        player.rotation.yaw += deltaYaw;
        player.rotation.pitch = Math.max(-1.0, Math.min(0.8, player.rotation.pitch + deltaPitch));
      },

      setSprint: function(sprinting) {
        player.isSprinting = sprinting;
      },

      jump: function() {
        if (player.isGrounded && (cameraMode === 'thirdperson' || cameraMode === 'firstperson')) {
          player.verticalVelocity = 12.5;
          player.isGrounded = false;
        }
      },

      setFlyVertical: function(v) {
        player.flyVertical = v;
      },

      setCameraMode: function(mode) {
        cameraMode = mode;
        if (mode === 'drone') {
          player.position.y = Math.max(player.position.y, 30);
        }
      },

      setTimeOfDay: function(presetName) {
        const p = timePresets[presetName] || timePresets.day;
        scene.background.setHex(p.skyColor);
        scene.fog.color.setHex(p.fogColor);
        hemiLight.color.setHex(p.skyColor);
        hemiLight.groundColor.setHex(p.groundColor);
        hemiLight.intensity = p.hemiIntensity;
        dirLight.color.setHex(p.sunColor);
        dirLight.intensity = p.sunIntensity;
        dirLight.position.set(p.sunPos[0], p.sunPos[1], p.sunPos[2]);

        streetLightsGroup.children.forEach(light => {
          light.intensity = p.streetLightIntensity;
        });
      },

      teleportTo: function(spawnKey) {
        const pt = spawnPoints[spawnKey] || spawnPoints.center;
        player.position.set(pt.x, pt.y, pt.z);
        player.rotation.yaw = pt.yaw;
        player.rotation.pitch = -0.08;
        player.verticalVelocity = 0;
        const groundY = getGroundHeight(pt.x, pt.z, pt.y);
        player.position.y = groundY;
        if (characterMesh) {
          characterMesh.position.copy(player.position);
          characterMesh.rotation.y = pt.yaw;
        }
      }
    };

    window.onload = init;
  </script>
</body>
</html>
